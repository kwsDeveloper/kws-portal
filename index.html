<title>업무 포털</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* =====================================================
   디자인 시스템 토큰
===================================================== */
:root {
  --primary:    #1D9BF0;
  --text:       #0F1419;
  --sub:        #536471;
  --bg:         #FFFFFF;
  --surface:    #FFFFFF;
  --border:     #EFF3F4;
  --divider:    #D4D8DD;
  --surface-raised: #F7F9FA;
  --primary-a08: rgba(29,155,240,.08);
  --primary-a15: rgba(29,155,240,.15);
  --shadow-btn:       0 6px 14px rgba(0,0,0,.25);
  --shadow-btn-hover: 0 8px 20px rgba(0,0,0,.30);
  --radius: 10px;
  --font: 'Montserrat', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  /* 로고 브랜드 컬러 — 헤더 전용 */
  --header-bg:     linear-gradient(135deg, #0B3654 0%, #174F33 100%);
  --header-accent: #4B9640;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary:        #1D9BF0;
    --text:           #E7E9EA;
    --sub:            #71767B;
    --bg:             #000000;
    --surface:        #16181C;
    --border:         #2F3336;
    --divider:        #4A4F55;
    --surface-raised: #1C1F23;
    --primary-a08: rgba(29,155,240,.12);
    --primary-a15: rgba(29,155,240,.20);
    --shadow-btn:       0 6px 14px rgba(0,0,0,.55);
    --shadow-btn-hover: 0 8px 20px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"] {
  --primary:        #1D9BF0;
  --text:           #E7E9EA;
  --sub:            #71767B;
  --bg:             #000000;
  --surface:        #16181C;
  --border:         #2F3336;
  --divider:        #4A4F55;
  --surface-raised: #1C1F23;
  --primary-a08: rgba(29,155,240,.12);
  --primary-a15: rgba(29,155,240,.20);
  --shadow-btn:       0 6px 14px rgba(0,0,0,.55);
  --shadow-btn-hover: 0 8px 20px rgba(0,0,0,.65);
}

/* =====================================================
   리셋
===================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
h1,h2,h3 { font-weight: 700; }
a { color: inherit; text-decoration: none; }
button { font-family: var(--font); cursor: pointer; border: none; background: none; }

/* =====================================================
   아이콘
===================================================== */
.icon {
  display: block; flex-shrink: 0;
  fill: none; stroke: currentColor;
  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}

/* =====================================================
   버튼
===================================================== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: var(--radius); padding: 12px 20px;
  font-family: var(--font); font-size: 14px; font-weight: 700;
  background: var(--primary); color: #fff;
  box-shadow: var(--shadow-btn);
  transition: transform .15s, box-shadow .15s;
  white-space: nowrap; cursor: pointer; border: none;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-btn-hover); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--primary);
  color: var(--primary);
  box-shadow: none;
}
.btn-outline:hover { background: var(--primary-a08); box-shadow: none; transform: none; }

.btn-red {
  background: #dc2626;
  box-shadow: 0 6px 14px rgba(220,38,38,.3);
}
.btn-red:hover { box-shadow: 0 8px 20px rgba(220,38,38,.4); }

.btn-ghost {
  padding: 5px 10px; border-radius: 7px;
  font-size: 12px; font-weight: 600; font-family: var(--font);
  color: var(--sub); background: transparent; border: none; cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-ghost:hover { background: var(--surface-raised); color: var(--text); }

.btn-danger { color: #dc2626 !important; }
.btn-danger:hover { background: rgba(220,38,38,.1) !important; color: #dc2626 !important; }

.btn-text {
  font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--sub); background: none; border: none; cursor: pointer;
  padding: 4px 8px; border-radius: 6px; transition: color .15s;
}
.btn-text:hover { color: var(--text); }

/* =====================================================
   헤더
===================================================== */
.header {
  position: sticky; top: 0; z-index: 200;
  background: var(--header-bg);
  border-bottom: 3px solid var(--header-accent);
}
.header-inner {
  max-width: 860px; margin: 0 auto; padding: 0 24px;
  height: 52px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
}
.logo { display: flex; align-items: center; flex-shrink: 0; min-width: 0; }
.logo-text-mode { display: flex; align-items: center; gap: 9px; }
.logo-img {
  height: 40px; max-width: 220px; object-fit: contain; display: block;
  background: rgba(255,255,255,.94);
  border-radius: 7px;
  padding: 4px 12px;
}
.logo-badge {
  width: 34px; height: 34px; border-radius: 8px;
  background: rgba(255,255,255,.18);
  border: 1.5px solid rgba(75,150,64,.6);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0; font-size: 13px;
  font-weight: 700; color: #fff; letter-spacing: -.5px;
}
.logo-badge img { width: 100%; height: 100%; object-fit: cover; }
.logo-name { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; }
.logo-sub  { font-size: 10px; color: rgba(255,255,255,.7); }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-portal-label { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.9); }
.hdr-btn {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.8); transition: background .15s, color .15s;
}
.hdr-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

/* =====================================================
   포털 메인
===================================================== */
.portal-main {
  flex: 1; max-width: 860px; width: 100%;
  margin: 0 auto; padding: 36px 24px 64px;
  position: relative; overflow: hidden;
}
.portal-bg-logo {
  position: absolute;
  bottom: 0; right: -24px;
  width: 55%; max-width: 420px;
  opacity: .2;
  mix-blend-mode: multiply;
  pointer-events: none; user-select: none; display: block;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .portal-bg-logo { mix-blend-mode: normal; opacity: .08; }
}
:root[data-theme="dark"] .portal-bg-logo { mix-blend-mode: normal; opacity: .08; }
.page-title {
  font-size: 22px; font-weight: 700; color: var(--text);
  margin-bottom: 32px; letter-spacing: -.035em;
}

/* 링크 테이블 */
.link-table { /* wrapper */ }
.link-row {
  display: flex; align-items: flex-start;
  border-top: 1.5px solid var(--divider);
  transition: background .18s ease;
}
.link-row:hover { background: var(--surface-raised); }
.link-row:last-child { border-bottom: 1.5px solid var(--divider); }

.row-label-cell {
  flex-shrink: 0; width: 108px; min-width: 108px;
  padding: 13px 14px 13px 0;
  border-right: 1.5px solid var(--divider);
  display: flex; align-items: flex-start; padding-top: 14px;
}
.label-badge {
  display: inline-block; padding: 5px 2px;
  font-size: 13px; font-weight: 700;
  color: #0B3654;
  letter-spacing: .03em; white-space: nowrap; line-height: 1.5;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .label-badge { color: #7FB4D8; }
}
:root[data-theme="dark"] .label-badge { color: #7FB4D8; }
.row-pills-cell {
  flex: 1; padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
}

/* 필 */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 16px; border-radius: 999px;
  border: 1.5px solid var(--divider);
  background: var(--surface-raised); font-family: var(--font);
  font-size: 13px; font-weight: 500; color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: border-color .2s, color .2s, background .2s,
              transform .2s cubic-bezier(.34,1.56,.64,1),
              box-shadow .2s ease;
  line-height: 1.4; cursor: pointer; white-space: nowrap;
}
.pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.pill.active:hover {
  border-color: var(--primary); color: var(--primary);
  background: var(--primary-a08);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(29,155,240,.22);
}
.pill.disabled {
  color: var(--sub); border-color: var(--border); background: var(--bg);
  opacity: .5; cursor: default; pointer-events: none; box-shadow: none;
}
.pill.coming-soon {
  border-color: var(--primary); color: var(--primary);
  background: var(--primary-a08); font-weight: 700;
  box-shadow: 0 2px 8px rgba(29,155,240,.18);
}
.pill.coming-soon:hover {
  background: var(--primary-a15);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(29,155,240,.28);
}
.empty-row { padding: 32px; text-align: center; color: var(--sub); font-size: 13px; }

/* =====================================================
   푸터
===================================================== */
.footer { border-top: 1.5px solid var(--border); background: var(--surface); }
.footer-inner {
  max-width: 860px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-copy { font-size: 12px; color: var(--sub); }
.footer-admin-btn { font-size: 12px; font-weight: 500; color: var(--sub); transition: color .15s; }
.footer-admin-btn:hover { color: var(--primary); }

/* =====================================================
   관리자 패널
===================================================== */
#adminPanel { flex: 1; display: flex; flex-direction: column; }

.admin-topbar { background: var(--surface-raised); border-bottom: 1.5px solid var(--divider); }
.admin-topbar-inner {
  max-width: 860px; margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; gap: 12px;
}
.admin-mode-badge {
  background: var(--primary); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
}
.admin-back-btn {
  font-size: 13px; font-weight: 500; color: var(--sub);
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; cursor: pointer;
  transition: color .15s;
}
.admin-back-btn:hover { color: var(--text); }

.admin-tabs-bar { border-bottom: 1.5px solid var(--divider); background: var(--surface); }
.admin-tabs-inner {
  max-width: 860px; margin: 0 auto; padding: 0 24px; display: flex;
}
.admin-tab {
  padding: 13px 18px; font-size: 14px; font-weight: 500; color: var(--sub);
  border: none; border-bottom: 2.5px solid transparent;
  margin-bottom: -1.5px; background: none; cursor: pointer;
  transition: color .15s; font-family: var(--font);
}
.admin-tab.active { color: var(--primary); font-weight: 700; border-bottom-color: var(--primary); }
.admin-tab:hover:not(.active) { color: var(--text); }

.admin-body { max-width: 860px; margin: 0 auto; padding: 28px 24px 64px; width: 100%; }

/* 링크 관리 */
.admin-section-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.admin-section-title {
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.count-badge {
  font-size: 11px; font-weight: 700; color: var(--sub);
  background: var(--border); padding: 2px 7px; border-radius: 10px;
}
.admin-empty { color: var(--sub); font-size: 14px; text-align: center; padding: 40px; }

.link-admin-list {
  border: 1.5px solid var(--divider); border-radius: 12px; overflow: hidden;
}
.link-admin-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-bottom: 1.5px solid var(--border);
  background: var(--surface); transition: background .12s;
}
.link-admin-item:last-child { border-bottom: none; }
.link-admin-item:hover { background: var(--surface-raised); }

.cat-chip {
  flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--sub);
  background: var(--border); padding: 3px 8px; border-radius: 6px; white-space: nowrap;
}
.link-admin-name {
  font-size: 13px; font-weight: 500; color: var(--text); flex: 1;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.link-admin-url {
  font-size: 12px; color: var(--sub); max-width: 160px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
}
.status-chip { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.status-active   { background: rgba(29,155,240,.1);  color: var(--primary); }
.status-disabled { background: var(--border); color: var(--sub); }
.status-coming   { background: rgba(251,191,36,.15); color: #d97706; }
.link-admin-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* 설정 */
.settings-card {
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 14px; background: var(--surface);
}
.settings-card-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; align-items: center; }
.form-row .form-input { flex: 1; }
.settings-hint { font-size: 11px; color: var(--sub); margin-top: 7px; }
.logo-header-preview {
  background: var(--header-bg);
  border-radius: 10px; padding: 10px 16px;
  margin-bottom: 6px;
  display: flex; align-items: center;
  min-height: 56px; border-bottom: 3px solid var(--header-accent);
}
.pw-actions { margin-top: 16px; }

/* 폰트 선택 */
.font-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 8px; margin-top: 4px;
}
.font-card {
  border: 2px solid var(--border); border-radius: 10px;
  padding: 13px 10px; cursor: pointer; text-align: center;
  transition: border-color .15s, background .15s;
  user-select: none;
}
.font-card:hover { border-color: var(--primary); background: var(--primary-a08); }
.font-card.selected { border-color: var(--primary); background: var(--primary-a08); }
.font-card-sample {
  font-size: 17px; font-weight: 700; color: var(--text);
  margin-bottom: 5px; line-height: 1.3;
}
.font-card-label { font-size: 10px; color: var(--sub); font-family: var(--font); }

/* =====================================================
   모달
===================================================== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center;
  z-index: 500; padding: 20px; backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface); border-radius: 16px;
  padding: 28px; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  border: 1.5px solid var(--border);
  animation: modalIn .18s ease;
}
.modal-sm { max-width: 340px; }

@keyframes modalIn {
  from { opacity: 0; transform: scale(.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal h2 { font-size: 18px; margin-bottom: 6px; }
.modal-desc { color: var(--sub); font-size: 13px; margin-bottom: 22px; }
.modal-actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; }

/* 폼 */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 12px; font-weight: 700; color: var(--sub);
  margin-bottom: 5px; letter-spacing: .02em;
}
.form-input, .form-select {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--text); background: var(--bg); outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-input::placeholder { color: var(--sub); font-weight: 400; }
.form-input:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-a08);
}
.form-hint { font-size: 11px; color: var(--sub); margin-top: 4px; }

/* =====================================================
   토스트
===================================================== */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; opacity: 0;
  transition: opacity .25s, transform .25s;
  z-index: 9999; max-width: calc(100vw - 32px);
  text-align: center; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =====================================================
   반응형
===================================================== */
@media (max-width: 600px) {
  .header-inner, .admin-topbar-inner, .admin-tabs-inner,
  .portal-main, .footer-inner, .admin-body { padding-left: 14px; padding-right: 14px; }
  .logo-sub { display: none; }
  .link-row { flex-direction: column; }
  .row-label-cell {
    width: 100%; min-width: 0; border-right: none;
    border-bottom: 1px solid var(--divider); padding: 10px 0 10px;
  }
  .row-pills-cell { padding: 10px 0 12px; }
  .page-title { font-size: 18px; margin-bottom: 20px; }
  .link-admin-url { display: none; }
  .portal-main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<!-- ===================== 헤더 ===================== -->
<header class="header">
  <div class="header-inner">
    <div class="logo" id="logoArea">
      <!-- 텍스트 모드 (로고 미등록 시) -->
      <div class="logo-text-mode" id="logoTextMode">
        <div class="logo-badge" id="logoBadge">대한</div>
        <div>
          <div class="logo-name" id="orgName">대한사회복지회</div>
          <div class="logo-sub">Korea Social Welfare Society</div>
        </div>
      </div>
      <!-- 이미지 모드 (로고 등록 시) -->
      <img class="logo-img" id="logoImg" src="" alt="회사 로고" style="display:none">
    </div>
  </div>
</header>

<!-- ===================== 포털 뷰 ===================== -->
<div id="portalView" style="flex:1;display:flex;flex-direction:column">
  <main class="portal-main">
    <h1 class="page-title" id="pageTitle">대한사회복지회 업무 포털</h1>
    <div class="link-table" id="linkTable"></div>
  </main>
</div>

<!-- ===================== 관리자 패널 ===================== -->
<div id="adminPanel" style="display:none">
  <!-- 상단 바 -->
  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <span class="admin-mode-badge">관리자 모드</span>
      <button class="admin-back-btn" onclick="exitAdmin()">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
        포털로 돌아가기
      </button>
    </div>
  </div>
  <!-- 탭 -->
  <div class="admin-tabs-bar">
    <div class="admin-tabs-inner">
      <button class="admin-tab active" data-tab="links" onclick="switchTab('links')">링크 관리</button>
      <button class="admin-tab" data-tab="settings" onclick="switchTab('settings')">설정</button>
    </div>
  </div>
  <!-- 콘텐츠 -->
  <div class="admin-body"><div id="adminContent"></div></div>
</div>

<!-- ===================== 푸터 ===================== -->
<footer class="footer">
  <div class="footer-inner">
    <span class="footer-copy" id="footerCopy">대한사회복지회 · 업무용 계정 전용</span>
    <button class="footer-admin-btn" id="footerAdminBtn">관리자</button>
  </div>
</footer>

<!-- ===================== 로그인 모달 ===================== -->
<div class="modal-overlay" id="loginModal">
  <div class="modal modal-sm">
    <h2>관리자 로그인</h2>
    <p class="modal-desc">관리자 비밀번호를 입력하세요</p>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="loginPw" autocomplete="current-password">
      </div>
      <div class="modal-actions">
        <button class="btn btn-sm" type="submit">로그인</button>
        <button class="btn-text" type="button" onclick="closeLogin()">취소</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== 링크 추가/수정 모달 ===================== -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h2 id="linkModalTitle">링크 추가</h2>

async function sbSetConfig(key, value) {
  try {
    const { error } = await sb.from('config').upsert({ key, value }, { onConflict: 'key' });
    if (error) { showToast('저장 오류: ' + error.message); return false; }
    return true;
  } catch(e) { showToast('저장 오류: ' + e.message); return false; }
}

async function sbSaveLink(link, sortOrder) {
  try {
    const { error } = await sb.from('links').upsert(
      { id: String(link.id), cat: link.cat, name: link.name, url: link.url, status: link.status, sort_order: sortOrder },
      { onConflict: 'id' }
    );
    if (error) { showToast('저장 오류: ' + error.message); return false; }
    return true;
  } catch(e) { showToast('저장 오류: ' + e.message); return false; }
}

async function sbDeleteLink(id) {
  try {
    const { error } = await sb.from('links').delete().eq('id', String(id));
    if (error) { showToast('삭제 오류: ' + error.message); return false; }
    return true;

function renderPortal() {
  // 헤더 / 타이틀 / 푸터 업데이트
  document.getElementById('orgName').textContent    = cfg.orgName;
  document.getElementById('pageTitle').textContent  = cfg.orgName + ' 업무 포털';

  // 로고 영역: 이미지 모드 ↔ 텍스트 모드
  const logoTextMode = document.getElementById('logoTextMode');
  const logoImg      = document.getElementById('logoImg');
  if (cfg.logo) {
    logoTextMode.style.display = 'none';
    logoImg.src                = cfg.logo;
    logoImg.style.display      = 'block';
  } else {
    logoTextMode.style.display = 'flex';
    logoImg.style.display      = 'none';
    document.getElementById('logoBadge').textContent = cfg.orgName.slice(0, 2);
  }

  // 배경 워터마크 (헤더 로고와 별도)
  const existingWm = document.getElementById('portalBgLogo');
  if (cfg.bgLogo) {
    if (existingWm) {
      existingWm.src = cfg.bgLogo;
    } else {
      const wm = document.createElement('img');
      wm.id = 'portalBgLogo';
      wm.className = 'portal-bg-logo';
      wm.src = cfg.bgLogo;
      wm.alt = '';
      wm.setAttribute('aria-hidden', 'true');
      document.querySelector('.portal-main').appendChild(wm);
    }
  } else if (existingWm) {
    existingWm.remove();
  }

  // 링크 테이블
  const groups  = toGroups(cfg.links);
  const table   = document.getElementById('linkTable');

  if (!groups.length) {
    table.innerHTML = '<div class="empty-row">등록된 링크가 없습니다.</div>';
    return;
  }
  table.innerHTML = groups.map(g => `
    <div class="link-row">
      <div class="row-label-cell"><span class="label-badge">${g.label}</span></div>
      <div class="row-pills-cell">${g.items.map(pillHTML).join('')}</div>
    </div>
  `).join('');
}

function toGroups(links) {
  const cats = [...new Set(links.map(l => l.cat))];
  return cats.map((cat, i) => ({ label: cat, idx: i, items: links.filter(l => l.cat === cat) }));
}

function pillHTML(item) {
  const cls  = `pill ${item.status || 'active'}`;
  if (item.status === 'disabled') return `<span class="${cls}">${item.name}</span>`;
  const isExt = item.url && item.url !== '#';
  const href  = isExt ? item.url : 'javascript:void(0)';
  const attrs = isExt ? ' target="_blank" rel="noopener noreferrer"' : '';
  const click = isExt ? '' : ` onclick="showToast('URL이 설정되지 않았습니다.')"`;
  return `<a class="${cls}" href="${href}"${attrs}${click}>${item.name}</a>`;
}

/* ===================================================

=================================================== */
async function saveOrgName() {
  const v = document.getElementById('sOrgName').value.trim();
  if (!v) { showToast('기관명을 입력해주세요.'); return; }
  cfg.orgName = v; saveCfg();
  await sbSetConfig('orgName', v);
  showToast('기관명이 저장되었습니다.');
}

function uploadLogo(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 1024 * 1024) { showToast('이미지가 1MB를 초과합니다.'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    cfg.logo = e.target.result; saveCfg();
    renderSettings(); showToast('로고가 저장되었습니다.');
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  cfg.logo = null; saveCfg();
  renderSettings(); showToast('로고가 삭제되었습니다.');
}

function uploadBgLogo(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('이미지가 2MB를 초과합니다.'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    cfg.bgLogo = e.target.result; saveCfg();
    renderPortal(); renderSettings(); showToast('배경 이미지가 저장되었습니다.');
  };
  reader.readAsDataURL(file);
}

async function applyFont(fontId) {
  const font = FONTS.find(f => f.id === fontId);
  if (!font) return;
  if (fontId !== 'Montserrat' && fontId !== 'Noto Sans KR') {
    let link = document.getElementById('dynFont');
    if (!link) {
      link = document.createElement('link');
      link.id = 'dynFont'; link.rel = 'stylesheet';
      document.head.appendChild(link);
    }
    link.href = `https://fonts.googleapis.com/css2?family=${font.url}&display=swap`;
  }
  document.documentElement.style.setProperty(
    '--font', `'${fontId}', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`
  );
  cfg.fontKey = fontId; saveCfg();
  await sbSetConfig('fontKey', fontId);
  showToast(`${font.label} 폰트가 적용되었습니다.`);
  document.querySelectorAll('.font-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.font === fontId)
  );
}

function removeBgLogo() {
  cfg.bgLogo = null; saveCfg();
  renderPortal(); renderSettings(); showToast('배경 이미지가 삭제되었습니다.');
}

  const cur  = document.getElementById('sCurPw').value;
  const nw   = document.getElementById('sNewPw').value;
  const nw2  = document.getElementById('sNewPw2').value;
  if (cur !== cfg.adminPw) { showToast('현재 비밀번호가 올바르지 않습니다.'); return; }
  if (!nw) { showToast('새 비밀번호를 입력해주세요.'); return; }
  if (nw !== nw2) { showToast('새 비밀번호가 일치하지 않습니다.'); return; }
  cfg.adminPw = nw; saveCfg();
  await sbSetConfig('adminPw', nw);
  ['sCurPw','sNewPw','sNewPw2'].forEach(id => document.getElementById(id).value = '');
  showToast('비밀번호가 변경되었습니다.');
}

/* ===================================================
   링크 추가/수정
=================================================== */
function openAddLink() {
  editingId = null;
  document.getElementById('linkModalTitle').textContent = '링크 추가';
  ['lCat','lName','lUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('lStatus').value = 'active';
  refreshCatList();
  openModal('linkModal');
  setTimeout(() => document.getElementById('lCat').focus(), 60);
}

function openEditLink(id) {
  const link = cfg.links.find(l => l.id === id);
  if (!link) return;
  editingId = id;
  document.getElementById('linkModalTitle').textContent = '링크 수정';
  document.getElementById('lCat').value    = link.cat;
  document.getElementById('lName').value   = link.name;
  document.getElementById('lUrl').value    = (link.url === '#' ? '' : link.url) || '';
  document.getElementById('lStatus').value = link.status || 'active';
  refreshCatList();
  openModal('linkModal');
}

function refreshCatList() {
  const cats = [...new Set(cfg.links.map(l => l.cat))];
  document.getElementById('catList').innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

function closeLinkModal() { closeModal('linkModal'); editingId = null; }

async function saveLink(e) {
  e.preventDefault();
  const cat    = document.getElementById('lCat').value.trim();
  const name   = document.getElementById('lName').value.trim();
  const url    = document.getElementById('lUrl').value.trim() || '#';
  const status = document.getElementById('lStatus').value;

  if (!cat)  { showToast('카테고리를 입력해주세요.'); return; }
  if (!name) { showToast('서비스 이름을 입력해주세요.'); return; }

  if (editingId) {
    const idx = cfg.links.findIndex(l => String(l.id) === String(editingId));
    if (idx > -1) {
      cfg.links[idx] = { ...cfg.links[idx], cat, name, url, status };
      await sbSaveLink(cfg.links[idx], idx);
    }
    showToast('링크가 수정되었습니다.');
  } else {
    const newLink = { id: 'u' + Date.now(), cat, name, url, status };
    cfg.links.push(newLink);
    await sbSaveLink(newLink, cfg.links.length - 1);
    showToast('링크가 추가되었습니다.');
  }
  saveCfg(); closeLinkModal(); renderLinkMgr();
}

/* ===================================================
   링크 삭제
=================================================== */
function openDelConfirm(id) {
  const link = cfg.links.find(l => String(l.id) === String(id));
  if (!link) return;
  deletingId = id;
  document.getElementById('confirmMsg').textContent = `"${link.name}"을(를) 삭제합니다. 되돌릴 수 없습니다.`;
  openModal('confirmModal');
}

function closeConfirm() { closeModal('confirmModal'); deletingId = null; }

async function doDelete() {
  if (!deletingId) return;
  await sbDeleteLink(deletingId);
  cfg.links = cfg.links.filter(l => String(l.id) !== String(deletingId));
  saveCfg(); closeConfirm(); renderLinkMgr();
  showToast('링크가 삭제되었습니다.');
}

/* ===================================================
   모달 열기/닫기 헬퍼
=================================================== */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* 오버레이 클릭으로 닫기 */
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      if (overlay.id === 'loginModal') closeLogin();
      else if (overlay.id === 'linkModal') closeLinkModal();
      else if (overlay.id === 'confirmModal') closeConfirm();
    }
  });
});

/* ESC 키 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('linkModal').classList.contains('open'))    closeLinkModal();
  else if (document.getElementById('confirmModal').classList.contains('open')) closeConfirm();
  else if (document.getElementById('loginModal').classList.contains('open'))   closeLogin();
});

/* ===================================================
   버튼 이벤트
=================================================== */
document.getElementById('footerAdminBtn').onclick = openAdmin;

/* ===================================================
   토스트
=================================================== */
let _tt = null;
function showToast(msg, ms = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), ms);
}

/* ===================================================
   초기화 (Supabase → localStorage fallback)
=================================================== */
async function initApp() {
  try {
    const [{ data: configRows, error: cfgErr }, { data: links, error: lnkErr }] = await Promise.all([
      sb.from('config').select('*'),
      sb.from('links').select('*').order('sort_order')
    ]);
    if (!cfgErr && configRows) {
      configRows.forEach(({ key, value }) => {
        if (key === 'orgName') cfg.orgName = value;
        if (key === 'adminPw') cfg.adminPw = value;
        if (key === 'fontKey') cfg.fontKey = value;
      });
    }
    if (!lnkErr && links && links.length > 0) {
      cfg.links = links;
    }
    if (cfgErr && lnkErr) throw new Error(cfgErr.message);
    saveCfg();
  } catch (e) {
    console.warn('Supabase 연결 실패 — 로컬 캐시 사용:', e.message);
    showToast('오프라인 모드: 로컬 저장 데이터를 사용합니다.');
  }
  document.getElementById('loadingOverlay').style.display = 'none';
  if (cfg.fontKey && cfg.fontKey !== 'Montserrat') await applyFont(cfg.fontKey);
  renderPortal();
}

initApp();
</script>
